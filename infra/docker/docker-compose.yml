version: "3.9"
services:
  backend:
    build: ../../apps/backend
    ports:
      - "8080:8080"
    env_file:
      - ../../apps/backend/.env
    depends_on:
      - supabase-db

  supabase-db:
    image: supabase/postgres:15.1.0.117
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
